services:

  ml-service:
    build:
      context: ../backend/ml-service
      dockerfile: Dockerfile
    container_name: justifai-ml-service
    ports: 
      - "8000:8000"
    volumes:
      - ../backend/ml-service/models:/app/models
      - ../backend/ml-service/reports:/app/reports
      - ../datasets/processed:/app/datasets/processed:ro
    restart: unless-stopped      

  postgres:
    image: postgres:17
    container_name: justifai-postgres
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "${DB_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped


  pgadmin:
    image: dpage/pgadmin4
    env_file:
      - ../.env
    container_name: justifai-pgadmin

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}

    ports:
      - "5050:80"

    depends_on:
      - postgres

    restart: unless-stopped


volumes:
  postgres_data:
